<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teeny Tiny Tanks</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/x-icon">
  <link rel="preload" href="assets/audio/speech/teenytinytanks.mp3" as="audio" type="audio/mpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body, * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    body { margin: 0; overflow: hidden; font-family: "Jersey 15", sans-serif; }
    canvas { display: block; }

    #splash {
      position: fixed;
      inset: 0;
      background: #FF5900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #splash.hidden { display: none; }

    #logo-container {
      width: min(90vw, 320px);
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #logo-container.hidden { display: none; }

    #splash-start-intro {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      animation: hover 1s infinite;
    }
    #splash-start-intro.hidden { display: none; }

    .ghosted { opacity: 0; }

    #logo-svg {
      width: min(90vw, 320px);
      max-height: 70vh;
      position: relative;
    }
    #logo-svg svg { width: 100%; height: auto; display: block;
    
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);}

    @keyframes hover {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    #tank-select {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 2rem;
      width: 100vw;
      max-width: 100%;
    }

    #tank-select:not(.hidden) { display: flex; }
    #tank-select.hidden { display: none; }

    .tank-select-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .corner {
      background: black;
      color: white;
      border-radius: 0.5rem;
      position: absolute;
      transform-origin: top left;
      transform: rotate(-45deg) translate(-50%, -20%);
      padding: 2.5em 3em .5em 3em;
      font-size: clamp(3rem, 6vw, 8rem);
      top: 0;
      left: 0;
    }

    .tank-select-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .tank-arrow {
      font-size: 2.5rem;
      background: black;
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
    }

    .tank-arrow:hover { opacity: 0.9; }
    .tank-arrow:disabled { opacity: 0.4; cursor: not-allowed; }

    #tank-preview-canvas {
      width: 400px;
      height: 300px;
      background: #FF5900;
    }

    .tank-name {
      color: white;
      font-size: clamp(3rem, 10vw, 10rem);
      font-weight: 100;
      margin: 0;
      text-align: center;
    }

    .tank-stats {
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      text-align: center;
      max-width: 320px;
    }

    .weapons-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .weapon-display {
      border: 4px solid #000;
      padding: 2rem 0;
      color: #000;
      width: 90px;
      font-size: 18px;
      cursor: pointer;
      text-align: center;
    }
    .weapon-display:hover { background: rgba(255,255,255,0.2); }
    .weapon-display.weapon-display-active { background: rgba(255,255,255,0.4); }

    .tank-stat-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.35rem 0;
    }

    .tank-stat-label { 
      min-width: 4rem; 
      text-align: left; 
    }

    .tank-stat-bar {
      display: flex;
      gap: 2px;
    }

    .tank-stat-notch {
      width: 14px;
      height: 12px;
      background: rgba(0,0,0,0.5);
    }

    .tank-stat-notch.filled {
      background: white;
    }

    #tank-select-continue {
      margin-top: 1rem;
    }

    
    .tank-select-right {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        flex: 1;
        min-width: 0;
      }

    /* Mobile vertical: smaller CHOOSE banner so it doesn't overlap tank name */
    @media (orientation: portrait) and (max-width: 600px) {
      .corner {
        font-size: clamp(1.8rem, 5vw, 3rem);
        padding: 2em 1.8em 0.3em 1.8em;
      }
      #tank-preview-canvas {
        width: 60vw;
        height: 60vw;
        aspect-ratio: 1/1;
      }
    }

    /* Mobile horizontal: name & tank left, stats/weapons/buttons right */
    @media (orientation: landscape) and (max-height: 600px) {
      #tank-select {
        padding: 0.5rem 1rem;
        gap: 0.5rem;
      }
      .tank-select-layout {
        flex-direction: row;
        flex: 1;
        width: 100%;
        max-width: 100%;
        gap: 1rem;
        align-items: center;
        justify-content: center;
      }
      .tank-select-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .tank-select-right {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        flex: 1;
        min-width: 0;
      }
      .tank-name {
        font-size: clamp(2rem, 6vw, 5rem);
      }
      #tank-preview-canvas {
        width: min(32vw, 200px);
        height: min(35vh, 180px);
      }
      .tank-select-row {
        gap: 0.5rem;
      }
      .tank-arrow {
        width: 36px;
        height: 36px;
        font-size: 1.8rem;
      }
      .tank-stats {
        max-width: none;
        text-align: left;
      }
      .tank-stat-row {
        justify-content: flex-start;
      }
      .weapons-row {
        justify-content: flex-start;
      }
      .weapon-display {
        padding: 1rem 0;
        width: 70px;
        font-size: 14px;
      }
      #tank-select-continue {
        padding: 0.5rem 1rem;
        font-size: 1.2rem;
      }
      .corner {
        font-size: clamp(2rem, 5vw, 4rem);
        padding: 1.5em 2em 0.3em 2em;
      }
    }

    #level-select {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 2rem 2rem;
      overflow-y: auto;
      position: relative;
      width: 100vw;
      max-width: 100%;
    }

    #level-select:not(.hidden) { display: flex; }
    #level-select.hidden { display: none; }

    .back-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-family: "Jersey 15", sans-serif;
      font-size: 1.2rem;
      background: black;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    .back-btn:hover { opacity: 0.9; }

    #level-select-logo {
      width: 80px;
      flex-shrink: 0;
    }
    #level-select-logo img { width: 100%; height: auto; display: block; }

    .level-grid {
      display: flex;
      max-width: 1000px;
      flex-wrap: wrap;
      gap: 1em;
      width: 100%;
    }

    .level-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      background: black;
      padding: 0.5rem;
      position: relative;
      width: calc(33% - 10px);
    }

    .level-card:hover::after {
      content: '';
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(135deg, #751f0000 0 10px, #ffffff 10px 20px);
      position: absolute;
      top: -10px;
      left: -10px;
      opacity: .5;
      z-index: -1;
      animation: glitch .4s infinite;
      z-index: -1;
      mix-blend-mode: overlay;
    }

    .level-card.locked {
      cursor: not-allowed;
      opacity: 0.5;
      filter: grayscale(0.8);
    }
    .level-card.locked:hover { opacity: 0.5; }

    .level-card-img {
      width: 100%;
      aspect-ratio: 3/2;
      background: linear-gradient(135deg, #2a2a4a 0%, #1a1a3a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 2rem;
      overflow: hidden;
    }
    .level-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (orientation: portrait) and (max-width: 600px) {
      .level-card {
        width: calc(50% - 10px);
      }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .level-card {
        width: calc(33% - 10px);
      }
    }

    .level-card-name {
      color: white;
      font-size: 1rem;
    }

    .splash-title {
      color: white;
      font-size: 1.5rem;
      margin: 0;
    }

    button {
      font-family: "Jersey 15", sans-serif;
      font-size: 1.5rem;
      background: black;
      color: white;
      border: none;
      border-radius: 0;
      padding: 0.75rem 2rem;
      cursor: pointer;
      position: relative;
    }

    button:hover::after {
      content: '';
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(135deg, #751f0000 0 10px, #bd0000 10px 20px);
      position: absolute;
      top: -10px;
      left: -10px;
      opacity: .5;
      z-index: -1;
      animation: glitch .4s infinite;
      z-index: 1;
      mix-blend-mode: overlay;
    }

    @keyframes glitch {
      0% {
        transform:translate(2px, -4px);
      }
      10% {
        transform:translate(2px, -4px);
      }
      20% {
        transform:translate(4px, -1px);
      }
      30% {
        transform:translate(4px, -1px);
      }
      40% {
        transform:translate(-2px, 3px);
      }
      50% {
        transform:translate(-2px, 3px);
      }
      60% {
        transform:translate(4px, -1px);
      }
      70% {
        transform:translate(4px, -1px);
      }
      80% {
        transform:translate(4px, -1px);
      }
      90% {
        transform:translate(4px, -1px);
      }
      100% {
        transform:translate(2px, -4px);
      }
    }

    #game-container {
      display: none;
    }

    #game-container:not(.hidden) {
      display: block;
    }

    .next-level-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
    }
    .next-level-btn.hidden { display: none; }

    .loss-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem;
      &::before {
        content:'';
        width: 100%;
        height: 100%;
        background: #ff762c;
        offset: 0;
        transform-origin: 50% 50%;
        transform: rotate(5deg);
        position: absolute;
        top: 50%;
        left: 50%;
        margin-left: -50%;
        margin-top: -52%;
        z-index: -1;
      }
    }
    .loss-overlay.hidden { display: none; }

    .you-win-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .you-win-overlay.hidden { display: none; }
    .you-win-text {
      font-family: "Jersey 15", sans-serif;
      font-size: clamp(4rem, 15vw, 8rem);
      color: white;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #261377;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      color: white;
      font-size: 1.5rem;
    }
    #loading-overlay.hidden { display: none; }

    .hud {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      max-width: 100%;
      display: flex;
      overflow: hidden;
    }

.hud-left {
  display: flex;
  gap: 10px;
  justify-content: space-around;
  position: relative;
  color: #fff;
  width: 250px;
  padding: 2.5em 1em 1.5em 1em;
  &::before {
    content:'';
    width: 120%;
    height: 120%;
    background: #000;
    transform-origin: top left;
    transform: rotate(5deg) translate(-5%, 5%);
    position: absolute;
    top: 0;
    left: 0;
    z-index: -1;
  }
}

.hud-data {
  text-align: center;
  opacity: 1;
  transform: scale(1);
}

@media (orientation: landscape) and (max-height: 600px) {
  .hud-data {
    display: flex;
    gap: .5rem;
  }
}

.hud-data-icon {
  width: 24px;
  height: 24px;
  object-fit: contain;
  filter: brightness(0) invert(1);
  display: block;
  margin: 0 auto 0.2em;
}
.hud-data-icon.hud-data-icon-text {
  filter: none;
  font-size: 1.8rem;
  line-height: 1;
}

.hud-data-deactive {
  opacity: .5;
  transform: scale(.7);
}

.hud-data-name {
  color: orange;
  font-size: 2rem;
}

.hud-center {
  flex-grow: 1;
}


.hud-right {
  display: flex;
  gap: 10px;
  justify-content: space-around;
  position: relative;
  color: #fff;
  width: 250px;
  padding: 2.5em 1em 1.5em 1em;
  &::before {
    content:'';
    width: 120%;
    height: 120%;
    background: #000;
    transform-origin: top right;
    transform: rotate(-5deg) translate(-5%, 5%);
    position: absolute;
    top: 0;
    left: 0;
    z-index: -1;
  }
}

@media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 600px) {
  .hud {
    bottom: auto;
    top: 0;
    flex-direction: row;
  }
  .hud-data-icon {
    display: none;
  }
  .hud-data-name {
    font-size: 1rem;
  }
  .hud-left, .hud-right {
    width: auto;
    padding: 10px;
    background: rgba(0,0,0,0.5);
    &::before {
      display: none;
    }
  }
}

/* Touchscreen: HUD at top so it doesn't overlap touch controls at bottom */
.is-touchscreen .hud {
  bottom: auto;
  top: 0;
  flex-direction: row;
}
.is-touchscreen .hud-data-icon {
  display: none;
}
.is-touchscreen .hud-data-name {
  font-size: 1rem;
}
.is-touchscreen .hud-left,
.is-touchscreen .hud-right {
  width: auto;
  padding: 10px;
  background: rgba(0,0,0,0.5);
}
.is-touchscreen .hud-left::before,
.is-touchscreen .hud-right::before {
  display: none;
}


    /* Touch controls overlay – transparent gray design */
    .touch-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
    .touch-controls > * { pointer-events: auto; }
    .touch-left {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 1.5rem;
    }
    .touch-zoom-zone {
      width: 140px;
      height: 44px;
      touch-action: none;
      cursor: pointer;
      align-self: flex-start;
    }
    .touch-zoom-track {
      width: 100%;
      height: 100%;
      background: rgba(55,55,55,0.38);
      border-radius: 22px;
      position: relative;
    }
    .touch-zoom-thumb {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(120,120,120,0.5);
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .touch-control-icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }
    .touch-btn-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      pointer-events: none;
    }
    .touch-joystick-and-angle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .touch-joystick-zone {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .touch-joystick-base {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(50,50,50,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .touch-joystick-stick {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(120,120,120,0.5);
      position: absolute;
      transition: transform 0.05s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(180,180,180,0.7);
      font-size: 1rem;
    }
    .touch-right {
      position: absolute;
      right: 0;
      bottom: 0;
      margin: 1.5rem;
    }
    .touch-joystick-rotate {
      right: 0;
      bottom: 0;
      width: 140px;
      height: 140px;
    }
    .touch-buttons-near-joystick {
      position: absolute;
      right: calc(100% + 20px);
      bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      pointer-events: none;
    }
    .touch-buttons-near-joystick .touch-btn {
      pointer-events: auto;
    }
    .touch-btn {
      width: 72px;
      height: 72px;
      font-family: "Jersey 15", sans-serif;
      font-size: 1.4rem;
      background: rgba(90,90,90,0.4);
      color: rgba(220,220,220,0.95);
      border-radius: 50%;
      touch-action: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .touch-btn:hover::after {
      display: none;
    }
    .touch-btn:active { background: rgba(120,120,120,0.5); }
    .touch-btn-fire {
      background: rgba(100,100,100,0.45);
      font-size: 1.6rem;
    }
    .touch-btn-fire:active { background: rgba(130,130,130,0.55); }
    .touch-btn-weapon {
      font-size: 1.2rem;
    }
    .touch-angle-zone {
      width: 44px;
      height: 120px;
      touch-action: none;
      cursor: pointer;
    }
    .touch-angle-track {
      width: 100%;
      height: 100%;
      background: rgba(55,55,55,0.38);
      border-radius: 22px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .touch-angle-thumb {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(120,120,120,0.5);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Tablet/iPad: scale down touch controls to prevent overlap (left ~196px + right ~220px + margins ~48px = ~464px needed) */
    @media (max-width: 520px) {
      .is-touchscreen .touch-left {
        transform: scale(0.7);
        transform-origin: bottom left;
      }
      .is-touchscreen .touch-right {
        transform: scale(0.7);
        transform-origin: bottom right;
      }
    }
    @media (min-width: 521px) and (max-width: 900px) {
      .is-touchscreen .touch-left {
        transform: scale(0.85);
        transform-origin: bottom left;
      }
      .is-touchscreen .touch-right {
        transform: scale(0.85);
        transform-origin: bottom right;
      }
    }

    /* Controls modal */
    .controls-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .controls-modal-overlay.hidden { display: none; }
    .controls-modal {
      background: #FF5900;
      padding: 1.5rem 2rem;
      max-width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
      font-family: "Jersey 15", sans-serif;
    }
    .controls-modal h2 {
      margin: 0 0 1rem 0;
      color: #000000;
      font-size: 2rem;
    }
    .controls-list {
      display: flex;
      flex-direction: row;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      width: 400px;
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: #000;
      cursor: pointer;
      transition: background 0.15s;
      width: calc(50% - 4px);
    }
    .controls-row:hover { background: rgb(41, 15, 4); }
    .controls-row.listening {
      background: rgba(255,136,0,0.3);
      border: 2px dashed #ff762c;
    }
    .controls-label { color: #fff; font-size: 1.2rem; }
    .controls-key {
      color: #ffffff;
      font-size: 1.1rem;
      min-width: 5rem;
      text-align: right;
    }
    .controls-modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .volume-controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-family: "Jersey 15", sans-serif;
      z-index: 10;
    }
    .volume-controls label {
      color: white;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .volume-controls input[type="range"] {
      width: 56px;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      border-radius: 0;
    }
    .volume-controls input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: linear-gradient(to right, #000 0%, #000 var(--fill, 0%), #FF5900 var(--fill, 0%), #FF5900 100%);
    }
    .volume-controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: #000;
      border: none;
      border-radius: 0;
      cursor: pointer;
    }
    .volume-controls input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      background: #000;
      border: none;
      border-radius: 0;
      cursor: pointer;
    }
    .volume-controls input[type="range"]::-moz-range-track {
      background: #FF5900;
    }
    .volume-controls input[type="range"]::-moz-range-progress {
      background: #000;
    }
    .volume-controls.hidden { display: none; }
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 600px) {
      .volume-controls { display: none !important; }
    }
